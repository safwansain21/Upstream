[project]
name = "upstream-services"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.141.1"]

[tool.pytest.ini_options]
pythonpath = [".", "packages/engine"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires local Supabase/Postgres", "security: authorization and tenant boundaries"]

[tool.ruff]
line-length = 110
target-version = "py312"
