# Free tiers sleep when idle (Render web service after 15 minutes, Supabase project after 7 days). The status check goes
# through Vercel to the API and touches the database, so one request keeps all three awake. Set the repository variable UPSTREAM_URL (docs/hosting.md).
name: keep hosted demo awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    if: vars.UPSTREAM_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 60 --max-time 120 "${{ vars.UPSTREAM_URL }}/api/v1/status"
